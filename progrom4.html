<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Tech Store</h1>

        <button class="bg-white text-blue-600 px-4 py-2 rounded-lg">
            Login
        </button>
    </nav>


    <!-- Heading -->
    <h2 class="text-3xl font-bold text-center my-8">
        Our Products
    </h2>


    <!-- Product Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-6">


        <!-- Phone -->
        <div class="bg-white border-2 border-gray-300 rounded-xl shadow-lg p-4 text-center">

            <img src="images/phone.jpg"
                 alt="Smart Phone"
                 class="w-full h-64 object-contain">

            <h3 class="text-xl font-bold mt-4">
                Smart Phone
            </h3>

            <p class="text-gray-500 text-lg mt-2">
                $24999
            </p>

            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg mt-4 hover:bg-blue-700">
                Buy Now
            </button>

        </div>


        <!-- Watch -->
        <div class="bg-white border-2 border-gray-300 rounded-xl shadow-lg p-4 text-center">

            <img src="images/wacht.webp"
                 alt="Smart Watch"
                 class="w-full h-64 object-contain">

            <h3 class="text-xl font-bold mt-4">
                Smart Watch
            </h3>

            <p class="text-gray-500 text-lg mt-2">
                $5499
            </p>

            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg mt-4 hover:bg-blue-700">
                Buy Now
            </button>

        </div>


        <!-- Fan -->
        <div class="bg-white border-2 border-gray-300 rounded-xl shadow-lg p-4 text-center">

            <img src="images/fan.webp"
                 alt="Smart Fan"
                 class="w-full h-64 object-contain">

            <h3 class="text-xl font-bold mt-4">
                Smart Fan
            </h3>

            <p class="text-gray-500 text-lg mt-2">
                $6499
            </p>

            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg mt-4 hover:bg-blue-700">
                Buy Now
            </button>

        </div>


        <!-- Cooler -->
        <div class="bg-white border-2 border-gray-300 rounded-xl shadow-lg p-4 text-center">

            <img src="images/cooler.webp"
                 alt="Smart Cooler"
                 class="w-full h-64 object-contain">

            <h3 class="text-xl font-bold mt-4">
                Smart Cooler
            </h3>

            <p class="text-gray-500 text-lg mt-2">
                $3499
            </p>

            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg mt-4 hover:bg-blue-700">
                Buy Now
            </button>

        </div>

    </div>

</body>
</html>
