<!DOCTYPE html>
<html>
<head>
<title>Cartoons</title>
<style>
body{text-align:center;font-family:Arial}
#cartoons{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.card{width:200px;padding:10px;box-shadow:0 2px 8px #aaa;cursor:pointer}
.card img{width:100%;height:120px;object-fit:cover}
</style>
</head>

<body>

<h1>Cartoon Gallery</h1>
<button onclick="load()">Load Cartoons</button>
<p id="msg"></p>
<div id="cartoons"></div>

<script>
function load(){

fetch("https://raw.githubusercontent.com/samyak2403/daily-movies-api/main/movies/cartoons/cartoons.json")
.then(r=>r.json())
.then(data=>{

data.movies.forEach((c,i)=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="${c.thumbnail}">
<h3>${c.title}</h3>
`;

card.onclick=()=>location.href="cartoon.html?i="+i;

document.getElementById("cartoons").appendChild(card);

});

document.getElementById("msg").innerText=data.movies.length+" cartoons loaded";

})
.catch(e=>document.getElementById("msg").innerText="Error");

}
</script>

</body>
</html>
