<!DOCTYPE html>
<html>
<head>
    <title>Cartoon Gallery - Fetch API</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 30px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
            margin: 20px;
        }

        #cartoons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 220px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #bbb;

            /* CLICK ಮಾಡಬಹುದು ಅಂತ ತೋರಿಸಲು */
            cursor: pointer;

            transition: 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px #999;
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            margin: 10px 0;
        }
    </style>
</head>

<body>

<h1>Cartoon Gallery</h1>

<button onclick="loadCartoons()">Load Cartoons</button>

<p id="message">Click the button to load cartoons...</p>

<div id="cartoons"></div>


<script>

function loadCartoons() {

    let message = document.querySelector("#message");
    let cartoons = document.querySelector("#cartoons");

    message.textContent = "⏳ Loading cartoons...";
    cartoons.innerHTML = "";

    fetch("https://raw.githubusercontent.com/samyak2403/daily-movies-api/main/movies/cartoons/cartoons.json")

    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to load cartoon data");
        }

        return response.json();
    })

    .then(data => {

        data.movies.forEach(cartoon => {

            // Card create
            let card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <img 
                    src="${cartoon.thumbnail}" 
                    alt="${cartoon.title}"
                >

                <h3>${cartoon.title}</h3>
            `;


            // ⭐ CARD CLICK
            card.addEventListener("click", function() {

                // cartoon.html ಗೆ id ಕಳುಹಿಸುವುದು
                window.location.href =
                    "cartoon.html?id=" + encodeURIComponent(cartoon.id);

            });


            // Galleryಗೆ card add
            cartoons.appendChild(card);

        });


        message.textContent =
            `✅ ${data.movies.length} cartoons loaded`;

    })

    .catch(error => {

        message.textContent =
            "❌ " + error.message;

    });

}

</script>

</body>
</html>
